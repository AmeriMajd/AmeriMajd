name: Generate profile README

on:
  push:
    branches: [main]
    paths:
      - readme.source.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-aura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate README with readme-aura
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes readme-aura@1.0.30 build
          --source readme.source.md
          --output README.md
          --assets .github/assets
          --github-user AmeriMajd
          --github-token "$GITHUB_TOKEN"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "docs: regenerate profile README"
            git push
          fi
