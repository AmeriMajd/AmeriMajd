name: Generate profile README

on:
  push:
    branches: [main]
    paths: [readme.source.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes readme-aura@1.0.20 build --github-user AmeriMajd --github-token "$GITHUB_TOKEN"
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          git diff --cached --quiet || git commit -m "docs: regenerate profile README"
          git push
